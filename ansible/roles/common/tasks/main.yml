---
- name: Update packages
  ansible.builtin.yum:
    name: "*"
    state: latest

- name: Install basic tools
  ansible.builtin.yum:
    name:
      - curl
      - wget
      - git
      - telnet
      - unzip
    state: present

- name: Disable swap
  ansible.builtin.command: swapoff -a
  become: true

- name: Ensure swap is disabled permanently
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '(^.*swap.*$)'
    replace: '# \1'
